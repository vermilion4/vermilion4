<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 470" width="320" height="470" role="img" aria-label="Handovr AI (Hackathon · Paypal Ai): Payment that releases when the work passes. Claude tests the site in a real browser against signed checks, then PayPal pays out. Built with Next.js, PayPal, Postgres.">
<title>Handovr AI (Hackathon · Paypal Ai): Payment that releases when the work passes. Claude tests the site in a real browser against signed checks, then PayPal pays out. Built with Next.js, PayPal, Postgres.</title>
<style>
.holo{animation:holo 5s ease-in-out infinite}@keyframes holo{0%,55%{transform:translateX(-420px)}100%{transform:translateX(420px)}}
.float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}
.star{animation:star 2.4s ease-in-out infinite}@keyframes star{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-30%" y="-60%" width="160%" height="220%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="2" fill="#000" opacity=".22"/>
</pattern>

<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3d2e"/><stop offset="1" stop-color="#06190f"/></linearGradient>
<radialGradient id="aura" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#4ade80" stop-opacity=".55"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset=".5" stop-color="#C1121F"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
<pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".09"/></pattern>
<clipPath id="cc"><rect x="6" y="6" width="308" height="458" rx="14"/></clipPath>
<clipPath id="ac"><rect x="20" y="56" width="280" height="196" rx="8"/></clipPath>
</defs>

<rect x="2" y="2" width="316" height="466" rx="18" fill="url(#edge)"/>
<g clip-path="url(#cc)">
<rect x="6" y="6" width="308" height="458" fill="#0c0709"/>
<rect x="20" y="20" width="50" height="24" rx="4" fill="#2a0b11" stroke="#ffd166" stroke-opacity="0.4"/>
<text x="45" y="37" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="900" fill="#ffd166" letter-spacing="1">SR</text>
<text class="star" style="animation-delay:0.0s" x="294" y="38" text-anchor="end" font-size="15" fill="#ffd166">★</text><text class="star" style="animation-delay:0.2s" x="277" y="38" text-anchor="end" font-size="15" fill="#ffd166">★</text><text class="star" style="animation-delay:0.4s" x="260" y="38" text-anchor="end" font-size="15" fill="#ffd166">★</text><text class="star" style="animation-delay:0.6s" x="243" y="38" text-anchor="end" font-size="15" fill="#ffd166">★</text>
<g clip-path="url(#ac)">
<rect x="20" y="56" width="280" height="196" fill="url(#art)"/>
<rect x="20" y="56" width="280" height="196" fill="url(#dots)"/>
<circle cx="160.0" cy="158" r="110" fill="url(#aura)"/>
<text class="float" x="160.0" y="186" text-anchor="middle" font-size="84">💸</text>
<text x="34" y="242" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#fff" fill-opacity=".55" letter-spacing="2">No.002/006</text>
</g>
<rect x="20" y="56" width="280" height="196" rx="8" fill="none" stroke="#fff" stroke-opacity=".12"/>
<text x="22" y="282" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#4ade80" letter-spacing="2">HACKATHON · PAYPAL AI</text>
<text x="22" y="309" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">Handovr AI</text>
<text x="22" y="332" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#d9cdd0">Payment that releases when the</text><text x="22" y="353" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#d9cdd0">work passes. Claude tests the site</text><text x="22" y="374" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#d9cdd0">in a real browser against signed</text><text x="22" y="395" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#d9cdd0">checks, then PayPal pays out.</text>
<rect x="22" y="408" width="66" height="24" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".6"/><text x="54.9" y="425" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#F2E9EA">Next.js</text><rect x="95.80000000000001" y="408" width="58" height="24" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".6"/><text x="125.0" y="425" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#F2E9EA">PayPal</text><rect x="162.20000000000002" y="408" width="73" height="24" rx="12" fill="#ffffff" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".6"/><text x="198.8" y="425" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#F2E9EA">Postgres</text>
<rect class="holo" x="-120" y="0" width="160" height="470" fill="url(#shine)" transform="skewX(-18)"/>
</g>

</svg>
