<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="06 SAVE DATA">
<title>06 SAVE DATA</title>
<style>.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}.run{animation:run 3s linear infinite}@keyframes run{from{transform:translateX(0)}to{transform:translateX(24px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
  <feGaussianBlur stdDeviation="5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-30%" y="-60%" width="160%" height="220%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="2" fill="#000" opacity=".22"/>
</pattern>

<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C1121F"/><stop offset="1" stop-color="#C1121F" stop-opacity="0"/></linearGradient>
<pattern id="chev" width="24" height="16" patternUnits="userSpaceOnUse"><path d="M4 2 l8 6 l-8 6" stroke="#C1121F" stroke-opacity=".35" stroke-width="2" fill="none"/></pattern>
<clipPath id="cl"><rect x="416" y="22" width="544" height="20"/></clipPath>
</defs>

<rect x="1" y="1" width="998" height="62" rx="10" fill="#0b0608" stroke="#C1121F" stroke-opacity=".35"/>
<rect x="14" y="13" width="66" height="38" rx="6" fill="#C1121F"/>
<text x="47" y="40" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="900" fill="#fff">06</text>
<text x="100" y="41" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="900" fill="#fff" letter-spacing="2">SAVE DATA</text>
<text x="290.20000000000005" y="40" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif" font-size="14" fill="#ff8a95" letter-spacing="3">セーブデータ</text>
<g clip-path="url(#cl)"><rect class="run" x="392" y="22" width="1000" height="20" fill="url(#chev)"/></g>
<text class="cur" x="978" y="40" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#C1121F">■</text>

</svg>
